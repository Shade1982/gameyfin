databaseChangeLog:
  # Preserve the identity of changesets originally defined in the master changelog.
  - logicalFilePath: db/changelog/db.changelog-master.yaml
  - changeSet:
      id: 2.6.0-game-media-order
      author: grimsi
      comment: >
        Store screenshots and videos in one ordered gallery. Legacy galleries have
        screenshots first, followed by videos; preserve duplicate video URLs.
      changes:
        - createTable:
            tableName: GAME_MEDIA
            columns:
              - column:
                  name: GAME_ID
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: FK_GAME_MEDIA_GAME
                    references: GAME(ID)
              - column:
                  name: MEDIA_POSITION
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: IMAGE_ID
                  type: bigint
                  constraints:
                    foreignKeyName: FK_GAME_MEDIA_IMAGE
                    references: IMAGE(ID)
              - column:
                  name: VIDEO_URL
                  type: varbinary(8192)
        - addPrimaryKey:
            tableName: GAME_MEDIA
            columnNames: GAME_ID, MEDIA_POSITION
            constraintName: PK_GAME_MEDIA
        - sql:
            sql: >
              ALTER TABLE GAME_MEDIA ADD CONSTRAINT CK_GAME_MEDIA_ITEM CHECK
              ((IMAGE_ID IS NOT NULL AND VIDEO_URL IS NULL) OR
               (IMAGE_ID IS NULL AND VIDEO_URL IS NOT NULL))
        - sql:
            sql: >
              INSERT INTO GAME_MEDIA (GAME_ID, MEDIA_POSITION, IMAGE_ID, VIDEO_URL)
              SELECT GAME_ID,
              ROW_NUMBER() OVER (PARTITION BY GAME_ID ORDER BY MEDIA_KIND, IMAGE_ID, VIDEO_URL) - 1,
              IMAGE_ID, VIDEO_URL
              FROM (
                SELECT GAME_ID, IMAGES_ID AS IMAGE_ID, NULL AS VIDEO_URL, 0 AS MEDIA_KIND FROM GAME_IMAGES
                UNION ALL
                SELECT GAME_ID, NULL AS IMAGE_ID, VIDEO_URLS AS VIDEO_URL, 1 AS MEDIA_KIND FROM GAME_VIDEO_URLS
              ) legacy_media
        - dropTable:
            tableName: GAME_IMAGES
        - dropTable:
            tableName: GAME_VIDEO_URLS
